<script>
(function(){try{var K='sonora-lang',d=document;
d.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[hreflang]');if(a)try{localStorage.setItem(K,a.getAttribute('hreflang'));}catch(x){}});
var s=localStorage.getItem(K),l=s||((navigator.languages&&navigator.languages[0])||navigator.language||'').slice(0,2).toLowerCase();if(l==='ja')location.replace('ja/thanks.html');}catch(e){}})();
(function(){var K='sonora-theme',m='system',r=document.documentElement,mq=window.matchMedia('(prefers-color-scheme: light)');
try{m=localStorage.getItem(K)||'system';}catch(e){}
function apply(){r.setAttribute('data-theme',m==='system'?(mq.matches?'light':'dark'):m);}
apply();
if(mq.addEventListener)mq.addEventListener('change',function(){if(m==='system')apply();});
document.addEventListener('DOMContentLoaded',function(){var sel=document.querySelector('.theme-select');if(!sel)return;sel.value=m;
sel.addEventListener('change',function(){m=sel.value;try{if(m==='system')localStorage.removeItem(K);else localStorage.setItem(K,m);}catch(e){}apply();});});})();
</script>
